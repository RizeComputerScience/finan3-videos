<script>
  const cues = "WEBVTT\n\n00:00:00.000 --> 00:00:03.830\nWhen a family takes out a mortgage,\nwho ends up owning the loan?\n\n00:00:04.660 --> 00:00:06.710\nUsually not the lender\nthat handed over the money.\n\n00:00:07.780 --> 00:00:10.230\nLet's follow one loan\nand see where it goes.\n\n00:00:10.988 --> 00:00:14.498\nA family borrows $300,000 to buy a house.\n\n00:00:14.808 --> 00:00:16.988\nThey'll pay it back month by month for\n\n00:00:17.038 --> 00:00:19.218\n30 years at a rate that never changes.\n\n00:00:19.908 --> 00:00:22.328\nThe lender hands over the money\nat the closing table, but the\n\n00:00:22.378 --> 00:00:24.798\nlender doesn't want to wait\n30 years to get it back.\n\n00:00:24.988 --> 00:00:27.738\nSo soon after closing, it sells the loan.\n\n00:00:28.528 --> 00:00:31.958\nThe buyer is usually\nFannie Mae or Freddie Mac.\n\n00:00:32.508 --> 00:00:36.458\nFannie Mae, for example,\nwould put the loan into a pool\n\n00:00:36.508 --> 00:00:40.458\nwith thousands of others and turn\nthe pool into mortgage-backed bonds.\n\n00:00:40.908 --> 00:00:45.858\nEach bond pays its owner a small\nshare of every family's payments.\n\n00:00:46.778 --> 00:00:49.518\nFannie Mae also promises the\nbonds' owners that they'll\n\n00:00:49.568 --> 00:00:52.308\nget paid even if some\nfamilies stop paying.\n\n00:00:52.838 --> 00:00:54.988\nBecause it's on the hook,\nFannie Mae has rules\n\n00:00:55.038 --> 00:00:57.188\nabout the loans it will and won't buy.\n\n00:00:57.648 --> 00:01:00.635\nA limit on the loan's size,\nextra protection, usually\n\n00:01:00.685 --> 00:01:03.672\nmortgage insurance when the\nfamily puts down less than\n\n00:01:03.722 --> 00:01:06.708\n20%, and a proof of the family's income.\n\n00:01:07.352 --> 00:01:09.442\nNow let's watch one monthly payment.\n\n00:01:09.832 --> 00:01:13.422\nA company called a servicer\ncollects it and keeps a small fee.\n\n00:01:13.952 --> 00:01:15.922\nFannie Mae keeps a fee for its guarantee.\n\n00:01:15.972 --> 00:01:18.912\nAnd the rest goes to the\nbond's owner, a bank, a pension\n\n00:01:18.962 --> 00:01:21.902\nfund, or a government on\nthe other side of the world.\n\n00:01:23.160 --> 00:01:24.650\nEveryone in the machine gains.\n\n00:01:25.100 --> 00:01:28.310\nThe lender gets its cash back\nand lends to the next family.\n\n00:01:28.720 --> 00:01:31.870\nThe investor gets steady\nincome from thousands of homes.\n\n00:01:31.920 --> 00:01:36.910\nAnd the family gets a fixed rate\nfor 30 years and a home to live in.\n\n00:01:37.460 --> 00:01:40.400\nIn the 2000s, Wall Street\nbuilt a copy of this machine\n\n00:01:40.450 --> 00:01:43.390\nfor the loans Fannie Mae and\nFreddie Mac wouldn't buy.\n\n00:01:43.920 --> 00:01:45.910\nLoans to borrowers with\nweak credit and loans\n\n00:01:45.960 --> 00:01:47.950\nwith little or no proof of income.\n\n00:01:48.400 --> 00:01:50.915\nBy 2005, Wall Street\nwas turning more loans\n\n00:01:50.965 --> 00:01:53.480\ninto bonds than Fannie\nand Freddie combined.\n\n00:01:53.883 --> 00:01:57.833\nThe copy was missing the\nguarantee, and with it the checks.\n\n00:01:58.223 --> 00:02:01.373\nNobody had promised the bonds'\nowners that they'd be paid.\n\n00:02:01.783 --> 00:02:04.553\nInstead, buyers trusted\nratings agencies, which were\n\n00:02:04.603 --> 00:02:07.373\npaid by the banks selling the bonds.\n\n00:02:07.803 --> 00:02:09.453\nIn 2006 alone,\n\n00:02:10.143 --> 00:02:13.293\nrating agency Moody's\ngave its top grade, AAA,\n\n00:02:13.343 --> 00:02:16.493\nto 30 mortgage bonds every working day.\n\n00:02:17.051 --> 00:02:21.581\nNow look at when each\nlink in the copy got paid.\n\n00:02:21.631 --> 00:02:24.101\nThe broker who brought\nthe family to the lender\n\n00:02:24.151 --> 00:02:26.621\nwhen the loan was made made a bonus.\n\n00:02:26.871 --> 00:02:29.901\nThe lender, when it sold\nthe loan, made commission.\n\n00:02:30.211 --> 00:02:32.711\nThe Wall Street bank, when\nit sold the bonds, and\n\n00:02:32.761 --> 00:02:35.261\nthe rating agency, when it\ngraded them, each got paid.\n\n00:02:35.891 --> 00:02:39.821\nBut the investor at the end\nneeded the family to keep paying.\n\n00:02:40.713 --> 00:02:44.283\nHouse prices peaked in 2006,\nand then they fell hard.\n\n00:02:44.633 --> 00:02:46.743\nThe riskiest loans went bad first.\n\n00:02:47.193 --> 00:02:50.043\nLenders had promised those\nloans met buyers' rules.\n\n00:02:50.093 --> 00:02:53.123\nSo the ones that failed within\nmonths were sent back to them.\n\n00:02:53.953 --> 00:02:56.783\nPayments stopped reaching the\ninvestors, and the bonds lost value.\n\n00:02:57.413 --> 00:03:01.503\nOf the bonds Moody's graded\nAAA in 2006, 83% were later cut\n\n00:03:01.553 --> 00:03:05.643\nto lower grades and may\nnot have paid back in full.\n\n00:03:06.423 --> 00:03:09.436\nThe losses ran back up\nthe chain to the banks\n\n00:03:09.486 --> 00:03:12.499\nthat held the bonds and\ncaused a series of cascading\n\n00:03:12.549 --> 00:03:15.563\nfailures, known today as\nthe 2008 financial crisis.\n\n00:03:16.106 --> 00:03:19.496\nSo when you buy a house,\nwho actually owns it?\n\n00:03:20.026 --> 00:03:20.736\nYou do.\n\n00:03:21.026 --> 00:03:23.416\nAnd the loan on it probably gets sold\n\n00:03:23.466 --> 00:03:25.856\nto an investor who you'll never meet.\n\n00:03:25.906 --> 00:03:29.236\nMost of the time, that\nworks fine for everyone.\n\n00:03:29.506 --> 00:03:33.646\nBut it breaks down when nobody\nin the chain is actually trusted\n\n00:03:33.696 --> 00:03:37.836\nor incentivized to check the loans\nand make sure they're any good.\n";
