<title>Is Charging Interest Evil?</title>

<script>
  const cues = "WEBVTT\n\n00:00:00.000 --> 00:00:03.805\nIn the 1300s, the poet Dante\nAlighieri imagined hell as\n\n00:00:03.855 --> 00:00:07.660\na series of circles going\ndown deep into the earth.\n\n00:00:08.230 --> 00:00:12.650\nIn the seventh circle, as one\nof the worst sins, on burning\n\n00:00:12.700 --> 00:00:17.120\nsand with fire falling from the\nsky, he imagined the moneylenders.\n\n00:00:17.630 --> 00:00:20.620\nEach one had a pouch hanging\nfrom his neck, marked\n\n00:00:20.670 --> 00:00:23.660\nwith his family's coat of\narms, and they stare at\n\n00:00:23.710 --> 00:00:26.700\nthose pouches forever while\nfire rains down from the sky\n\n00:00:26.750 --> 00:00:27.760\nand burns them.\n\n00:00:28.577 --> 00:00:31.367\nTheir sin was lending money at interest.\n\n00:00:31.837 --> 00:00:34.857\nIf you have a savings account,\nyour bank pays you interest,\n\n00:00:34.907 --> 00:00:37.927\nwhich makes you, in a small\nway, a moneylender too.\n\n00:00:38.437 --> 00:00:41.537\nWould Dante have thought\nthat you should be\n\n00:00:41.587 --> 00:00:44.687\nthere, in hell, with fire\nraining down everywhere?\n\n00:00:45.157 --> 00:00:48.967\nWhy did so many people, for a\nlong time, think he was right?\n\n00:00:50.043 --> 00:00:52.253\nInterest is rent that gets paid on money.\n\n00:00:52.303 --> 00:00:54.093\nSo let's look at why renting out\n\n00:00:54.143 --> 00:00:55.933\nmoney, of all things, seemed so wrong.\n\n00:00:56.790 --> 00:01:00.440\nStart with the Greek philosopher\nAristotle, in the 300s BC.\n\n00:01:01.070 --> 00:01:05.000\nTo him, money was a tool for trading,\nand a tool can't have children.\n\n00:01:05.390 --> 00:01:07.830\nHe wrote that money\nwas intended to be used\n\n00:01:07.880 --> 00:01:10.320\nin exchange, but not to\nincrease at interest.\n\n00:01:11.090 --> 00:01:13.840\nInterest, he said, is the\nbirth of money from money, and\n\n00:01:13.890 --> 00:01:16.640\nof all the ways to get\nrich, the most unnatural.\n\n00:01:17.683 --> 00:01:20.053\nThe Jewish Torah draws a different line.\n\n00:01:20.103 --> 00:01:21.713\nThe book of Deuteronomy says,\n\n00:01:22.363 --> 00:01:25.373\nYou shall not lend on\ninterest to your brother,\n\n00:01:25.423 --> 00:01:28.433\nand then you may charge\na foreigner interest.\n\n00:01:29.443 --> 00:01:32.603\nLeviticus adds, If your brother\nhas become poor, take no\n\n00:01:32.653 --> 00:01:35.813\ninterest from him, that your\nbrother may live among you.\n\n00:01:36.303 --> 00:01:39.623\nA loan to a neighbor in trouble\nwas meant to keep him on\n\n00:01:39.673 --> 00:01:42.993\nhis feet, not to earn a profit from\nhim, which was considered exploitative.\n\n00:01:43.100 --> 00:01:45.263\nThe Catholic Church went further.\n\n00:01:45.713 --> 00:01:48.672\nIn 325, the Council of Nicaea said that\n\n00:01:48.722 --> 00:01:51.683\npriests who lent at\ninterest would be removed.\n\n00:01:52.073 --> 00:01:55.223\nIn 1179, a council in Rome refused\n\n00:01:55.273 --> 00:01:58.422\nknown moneylenders communion\nand a Christian burial.\n\n00:01:58.812 --> 00:02:01.916\nAnd in 1311, the Council\nof Vienne said that anyone\n\n00:02:01.966 --> 00:02:05.069\nwho stubbornly insisted on\ninterest and said it was not\n\n00:02:05.119 --> 00:02:08.222\na sin should be treated as a heretic.\n\n00:02:08.273 --> 00:02:11.352\nTo the scholars of the time, usury meant\n\n00:02:11.403 --> 00:02:14.482\nany interest on a loan, high or low.\n\n00:02:15.300 --> 00:02:17.090\nSo how did anyone get a loan?\n\n00:02:18.040 --> 00:02:20.510\nLook at Florence, home to several of\n\n00:02:20.560 --> 00:02:23.030\nDante's moneylenders and\nto Europe's great bankers.\n\n00:02:23.540 --> 00:02:27.480\nThey used a bill of exchange,\na written order, to pay money\n\n00:02:27.530 --> 00:02:31.470\nin another city, in that city's\ncurrency, at a later date.\n\n00:02:31.520 --> 00:02:35.170\nA London banker might pay\n44 pennies for each Venetian\n\n00:02:35.220 --> 00:02:38.870\nducat to be paid in\nVenice three months later.\n\n00:02:39.400 --> 00:02:41.900\nThree months after that,\nthe money comes back\n\n00:02:41.950 --> 00:02:44.450\nto London at 47 pennies per ducat.\n\n00:02:45.100 --> 00:02:49.830\nThat's three pennies gain on\n44, about 7% in six months.\n\n00:02:50.400 --> 00:02:54.040\nChurch scholars mostly accepted\nit as a trade because exchange\n\n00:02:54.090 --> 00:02:57.730\nrates could move, so the\nprofit was not certain.\n\n00:02:57.780 --> 00:03:02.170\nThe Medici bank kept an account\nfor profit and loss on exchange.\n\n00:03:02.500 --> 00:03:04.470\nIt had no account for interest.\n\n00:03:05.397 --> 00:03:07.767\nSlowly but surely, the line moved.\n\n00:03:08.277 --> 00:03:12.127\nThe reformer, John Calvin, allowed\ninterest on business loans, but said\n\n00:03:12.177 --> 00:03:16.027\nit should never be demanded\nof poor and needy men.\n\n00:03:16.497 --> 00:03:21.487\nIn 1545, England's Parliament\nallowed interest up to 10% a year.\n\n00:03:22.350 --> 00:03:23.700\nIslam kept the ban.\n\n00:03:23.750 --> 00:03:25.710\nThe Quran even answers the people who\n\n00:03:25.760 --> 00:03:27.720\nsaid interest was no different from trade.\n\n00:03:28.410 --> 00:03:31.480\nQuote, They say trade is\njust like interest, but\n\n00:03:31.530 --> 00:03:34.600\nAllah has permitted trade\nand has forbidden interest.\n\n00:03:35.170 --> 00:03:38.080\nSo Islamic finance is built\non trade and partnership.\n\n00:03:38.550 --> 00:03:41.460\nTo buy a house, a financier can buy it and\n\n00:03:41.510 --> 00:03:44.420\nsell it to you at a\nhigher price paid monthly.\n\n00:03:45.070 --> 00:03:47.230\nOr it can buy the house with you and\n\n00:03:47.280 --> 00:03:49.440\nrent you its share until\nyou've bought it out.\n\n00:03:50.043 --> 00:03:51.773\nAnd the argument still isn't over.\n\n00:03:51.823 --> 00:03:54.653\nIn 2025, a bill in the U.S.\n\n00:03:54.803 --> 00:03:57.293\nSenate proposed capping\ncredit card interest at 10%.\n\n00:03:57.343 --> 00:04:00.883\nAnd in 2026, the President\ncalled for a one-year cap at\n\n00:04:00.933 --> 00:04:04.473\nthe same rate, the same number\nEngland allowed, in 1545.\n\n00:04:05.223 --> 00:04:06.953\nSo is charging interest evil?\n\n00:04:07.483 --> 00:04:09.473\nThese traditions never fully agreed.\n\n00:04:10.083 --> 00:04:13.353\nAristotle and the medieval Church\nobjected to any interest at all.\n\n00:04:13.583 --> 00:04:14.693\nAnd Islam still does.\n\n00:04:14.743 --> 00:04:16.973\nThe Torah drew its sharpest line around\n\n00:04:17.023 --> 00:04:19.253\na neighbor who had become poor.\n\n00:04:19.583 --> 00:04:22.713\nAnd Calvin drew his\naround the poor and needy.\n\n00:04:23.143 --> 00:04:25.683\nMuch of the argument, then and now, is\n\n00:04:25.733 --> 00:04:28.273\nabout who is doing the borrowing and why.\n";
