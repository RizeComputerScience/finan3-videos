<script>
  const cues = "WEBVTT\n\n00:00:00.000 --> 00:00:03.260\nWhat do you actually own when\nyou own a share of stock?\n\n00:00:04.030 --> 00:00:05.760\nLet's start with one pizza shop.\n\n00:00:06.503 --> 00:00:07.953\nRosa owns a pizza shop.\n\n00:00:08.643 --> 00:00:10.053\nEvery dollar of profit is hers.\n\n00:00:10.483 --> 00:00:13.103\nShe wants a second shop, which would cost\n\n00:00:13.153 --> 00:00:15.773\n$100,000, and she doesn't have the cash.\n\n00:00:16.223 --> 00:00:19.583\nShe could borrow it, but then\nshe'll owe the bank, and she'll have\n\n00:00:19.633 --> 00:00:22.993\nto pay back in good years and\nbad, which is quite risky.\n\n00:00:23.443 --> 00:00:26.413\nOr she could sell part of her pizza shop.\n\n00:00:27.057 --> 00:00:28.047\nSo she does.\n\n00:00:28.097 --> 00:00:30.527\nLet's picture the\ncompany as one big pizza.\n\n00:00:31.197 --> 00:00:33.177\nRosa cuts it into 80 equal slices, and\n\n00:00:33.227 --> 00:00:35.207\nat the start, every slice is hers.\n\n00:00:35.877 --> 00:00:38.647\nThen the company cuts 20 new slices and\n\n00:00:38.697 --> 00:00:41.467\nsells them to a neighbor for $5,000 each.\n\n00:00:42.037 --> 00:00:44.307\nThat's $100,000, and it goes to her\n\n00:00:44.357 --> 00:00:46.627\ncompany, which builds the second shop.\n\n00:00:47.429 --> 00:00:51.099\nNow, there are 100 slices, and\nthe neighbor holds 20 of them.\n\n00:00:51.609 --> 00:00:53.259\nThose slices are called shares.\n\n00:00:53.309 --> 00:00:57.299\n20 shares out of 100 is 20%\nof Rosa's Pizza, a fifth of\n\n00:00:57.349 --> 00:01:01.339\nevery future profit, and a fifth\nof the votes on big decisions.\n\n00:01:02.129 --> 00:01:06.899\nYears later, suppose Rosa's Pizza\nhas 40 shops and wants 200 more.\n\n00:01:07.389 --> 00:01:08.859\nMaybe it goes public.\n\n00:01:09.349 --> 00:01:12.629\nIn an initial public offering,\nit cuts many more slices\n\n00:01:12.679 --> 00:01:15.959\nof the company, and banks\nfind investors to buy them.\n\n00:01:16.009 --> 00:01:18.999\nThe money from that sale\ngoes to the company.\n\n00:01:19.452 --> 00:01:22.592\nAfter that, the shares can\ntrade on a stock exchange,\n\n00:01:22.642 --> 00:01:25.782\nand the company is no longer\ninvolved in trading them.\n\n00:01:26.132 --> 00:01:29.282\nWhen you buy a share, you're\nbuying it from another investor.\n\n00:01:29.852 --> 00:01:33.042\nAirbnb sold new shares at $68 in 2020.\n\n00:01:33.672 --> 00:01:36.342\nThe next day, stock buyers and sellers\n\n00:01:36.392 --> 00:01:39.062\nwere trading the shares at about $145.\n\n00:01:39.749 --> 00:01:41.056\nWhat sets the price?\n\n00:01:41.866 --> 00:01:45.136\nA slice is worth its share\nof every future profit.\n\n00:01:45.506 --> 00:01:48.706\nNobody knows those profits\nfor sure, so the price is the\n\n00:01:48.756 --> 00:01:51.956\nmarket's best guess, and it moves\nwhenever that guess changes.\n\n00:01:52.732 --> 00:01:53.862\nEvery three months,\n\n00:01:54.612 --> 00:01:56.762\nRosa's Pizza reports its profits. If it's\n\n00:01:56.812 --> 00:01:58.962\na public company, that's required by law.\n\n00:01:59.792 --> 00:02:04.482\nSay investors expected profit to\ngrow 20%, and it grew just 10%.\n\n00:02:04.532 --> 00:02:08.792\nThe company made more money than\nlast year, but the stock will\n\n00:02:08.842 --> 00:02:13.102\nstill fall because the price had\nalready counted on 20% growth.\n\n00:02:13.752 --> 00:02:17.322\nPrices move on the gap between what\nhappened and what was expected.\n\n00:02:18.075 --> 00:02:21.665\nIf you have a retirement account\nat work, you'll probably end up\n\n00:02:21.715 --> 00:02:25.305\nowning slices of hundreds of companies\nlike this one, through a fund.\n\n00:02:25.675 --> 00:02:29.195\nYou won't necessarily pick the slices.\nYou'll own a little of everything, and\n\n00:02:29.245 --> 00:02:32.765\nyou'll get a share of profits\nof every company in the market.\n";
