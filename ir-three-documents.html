<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding a Company&#x27;s Three Documents on Its Investor Relations Page</title>
<style>
  html, body { margin: 0; height: 100%; background: #F7F5F0; }
  body { display: flex; align-items: center; justify-content: center; }
  video { width: 100%; max-height: 100vh; aspect-ratio: 16 / 9; background: #F7F5F0; display: block; }
  #cc { position: fixed; top: 12px; left: 12px; z-index: 2; font: 600 14px/1 system-ui, sans-serif;
         color: #FFFFFF; background: rgba(27, 33, 29, 0.78); border: 0; border-radius: 6px;
         padding: 9px 12px; cursor: pointer; }
  #cc:focus-visible { outline: 3px solid #FFD84D; outline-offset: 2px; }
  video::cue { font-family: system-ui, sans-serif; font-size: 1.0em; line-height: 1.35;
               color: #FFFFFF; background: rgba(27, 33, 29, 0.86); }
</style>
</head>
<body>
<video id="v" controls playsinline preload="metadata" poster="ir-three-documents.jpg"
       aria-label="Finding a Company&#x27;s Three Documents on Its Investor Relations Page" src="ir-three-documents.mp4"></video>
<button id="cc" type="button" aria-pressed="false">Captions: off</button>
<script>
  const cues = "WEBVTT\n\n00:00:06.687 --> 00:00:11.049\nOpen the investor relations page. Its address is your first link\n\n00:00:11.049 --> 00:00:14.761\nIf a cookie notice appears, choose No, I decline\n\n00:00:14.761 --> 00:00:22.121\nScroll down to Latest quarterly results and select View all results\n\n00:00:22.121 --> 00:00:27.721\nThe newest quarter is at the top. Note which quarter it is\n\n00:00:27.721 --> 00:00:33.560\nRight-click Earnings release and choose Copy Link Address. That is your second link\n\n00:00:33.560 --> 00:00:39.610\nNow scroll down to Quick links and select Annual reports & proxies\n\n00:00:39.610 --> 00:00:45.801\nThe newest annual report is at the top. Note which year it covers\n\n00:00:45.801 --> 00:00:51.692\nRight-click its link and choose Copy Link Address. That is your third link\n";
  const v = document.getElementById('v');
  const t = document.createElement('track');
  t.kind = 'captions'; t.label = 'English'; t.srclang = 'en';
  t.src = URL.createObjectURL(new Blob([cues], { type: 'text/vtt' }));
  v.appendChild(t);
  v.textTracks[0].mode = 'hidden';
  const cc = document.getElementById('cc');
  cc.addEventListener('click', () => {
    const on = v.textTracks[0].mode !== 'showing';
    v.textTracks[0].mode = on ? 'showing' : 'hidden';
    cc.setAttribute('aria-pressed', on); cc.textContent = on ? 'Captions: on' : 'Captions: off';
  });
  if (new URLSearchParams(location.search).get('test')) { v.muted = true; v.play(); }
  const at = new URLSearchParams(location.search).get('t');
  if (at) v.addEventListener('loadedmetadata', () => { v.currentTime = parseFloat(at); });
</script>
</body>
</html>
